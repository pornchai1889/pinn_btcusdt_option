# configs/config_put.yaml

experiment:
  name: "Put_Option"
  description: "PINN for Bitcoin Put Option Pricing using Mixed Distribution Sampling"

device: "cuda:0"

# ------------------------------------------------------------------------------
# 1. Market Parameters
# ------------------------------------------------------------------------------
market:
  T_MAX: 0.25
  S_range: [0.0, 1000000.0]
  K_range: [10000.0, 500000.0]
  K_step: 1000.0
  t_range: [0.0, 0.25]
  sigma_range: [0.1, 2.0]
  r_range: [0.0, 0.15]

# ------------------------------------------------------------------------------
# 2. Data Sampling Strategy
# ------------------------------------------------------------------------------
sampling:
  moneyness_range: [0.5, 1.5]
  adaptive_std: 1.0           
  time_sampling_power: 2.0

# ------------------------------------------------------------------------------
# 3. Model Architecture
# ------------------------------------------------------------------------------
model:
  n_input: 5
  n_output: 1
  n_hidden: 256
  n_layers: 4

# ------------------------------------------------------------------------------
# 4. Training Hyperparameters
# ------------------------------------------------------------------------------
training:
  mode: "scratch"
  epochs: 50000
  lr: 1.0e-4
  
  n_sample_data: 10000
  n_sample_pde_multiplier: 4
  physics_loss_weight: 0.1
  
  val_interval: 1000
  n_val_sample: 100000
  checkpoint_epochs: 1000

# ------------------------------------------------------------------------------
# 5. Validation Fixed Parameters
# ------------------------------------------------------------------------------
validation_params:            
  fix_sigma: 0.5
  fix_r: 0.05