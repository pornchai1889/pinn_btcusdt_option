# .github/workflows/ci.yml
# Continuous Integration (CI) Pipeline for PINN Finance Project
name: PINN Finance CI Pipeline

# ==============================================================================
# Trigger Strategy
# ==============================================================================
# 1. Push to main: Ensures the stable branch is always green.
# 2. Pull Request: Acts as a quality gate before merging code.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ==============================================================================
# Jobs Configuration
# ==============================================================================
jobs:
  build-and-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Matrix Strategy: Run tests across multiple Python versions in parallel.
    # This ensures backward compatibility and robustness.
    strategy:
      fail-fast: false # If one version fails, don't cancel others immediately
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    # --------------------------------------------------------------------------
    # 1. Setup Environment
    # --------------------------------------------------------------------------
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Enable caching to speed up future runs

    # --------------------------------------------------------------------------
    # 2. Install Dependencies
    # --------------------------------------------------------------------------
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # --------------------------------------------------------------------------
    # 3. Code Quality Checks (Static Analysis)
    # --------------------------------------------------------------------------
    - name: Check Code Formatting (Black)
      # Uses Black in check mode (--check). Fails if code isn't formatted.
      run: |
        black src tests --check --verbose

    - name: Check Code Style (Flake8)
      # Checks for syntax errors and undefined names.
      # E501 ignores line length (Black handles that).
      run: |
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type Checking (Mypy)
      # Enforces type hinting. Essential for robust financial code.
      run: |
        mypy src tests --ignore-missing-imports

    # --------------------------------------------------------------------------
    # 4. Run Unit Tests (The Core Logic)
    # --------------------------------------------------------------------------
    - name: Run Pytest with Coverage
      # Runs all tests in 'tests/' directory and reports coverage for 'src/'
      run: |
        pytest tests/ --cov=src --cov-report=term-missing