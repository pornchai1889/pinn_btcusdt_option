# .github/workflows/cd.yml
# Continuous Delivery (CD) Pipeline for PINN Finance Project
name: PINN Finance CD Pipeline

# ==============================================================================
# Trigger Strategy
# ==============================================================================
# 1. Push to main: Automates deployment when code is merged to the stable branch.
# 2. Workflow Dispatch: Allows manual triggering for ad-hoc deployments or rollbacks.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# ==============================================================================
# Jobs Configuration
# ==============================================================================
jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    
    # Permission settings for the GITHUB_TOKEN (Security Best Practice)
    permissions:
      contents: read
      packages: write

    steps:
    # --------------------------------------------------------------------------
    # 1. Setup Environment & Context
    # --------------------------------------------------------------------------
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      # Initializes Docker Buildx, an extended build tool that supports 
      # multi-platform builds and advanced caching mechanisms.
      uses: docker/setup-buildx-action@v3

    # --------------------------------------------------------------------------
    # 2. Authentication (Registry Login)
    # --------------------------------------------------------------------------
    - name: Log in to Docker Hub
      # Authenticates against the container registry using encrypted secrets.
      # Security Note: Never expose credentials in plaintext logs.
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # --------------------------------------------------------------------------
    # 3. Build and Distribution (The Core Logic)
    # --------------------------------------------------------------------------
    - name: Build and Push Image
      # Builds the container image from the Dockerfile and pushes it to the registry.
      # Tagging Strategy:
      # - 'latest': Always points to the most recent stable build.
      # - 'v{run_number}': Immutable version tag for traceability and rollback.
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/pinn-api:latest
          ${{ secrets.DOCKER_USERNAME }}/pinn-api:v${{ github.run_number }}
        
        # Optimization: Use GitHub Actions cache backend to speed up future builds
        cache-from: type=gha
        cache-to: type=gha,mode=max